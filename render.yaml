services:
  - type: web
    name: nexo-yt-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_URL
        sync: false   # lo ponés manualmente en Render después de deployar
